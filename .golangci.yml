linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # テストファイルでは一部のチェックを緩和
    - path: _test\.go
      linters:
        - errcheck
